  <g class="hand label">
    <text x="600" y="174">Participant opens registration link</text><text x="600" y="301">Personal details — entered once</text>
    <text x="600" y="428">Next required form</text><text x="600" y="555">Fill in and sign</text><text x="600" y="682">API stores the submission</text>
    <text x="600" y="829"><tspan x="600">All required forms</tspan><tspan x="600" dy="28">complete?</tspan></text>
    <text x="1000" y="831"><tspan x="1000">Generate PDFs from</tspan><tspan x="1000" dy="28">official templates</tspan></text>
    <text x="1000" y="957"><tspan x="1000">Email secure, expiring</tspan><tspan x="1000" dy="28">download links</tspan></text>
  </g>
  <text class="hand small" x="805" y="820" fill="#15803d">YES</text><text class="hand small" x="265" y="815" fill="#b91c1c">NO — continue</text>
