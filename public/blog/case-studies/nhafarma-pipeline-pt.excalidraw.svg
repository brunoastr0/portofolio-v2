<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" class="excalidraw-svg">
  <!-- svg-source:excalidraw -->
  <defs>
    <style>
      .hand{font-family:"Comic Sans MS","Segoe Print",sans-serif;fill:#292524}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#78716c}.label{font-size:20px;font-weight:600;text-anchor:middle}.num{font-size:16px;font-weight:700;text-anchor:middle;fill:#1d4ed8}.box{stroke:#57534e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#57534e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
