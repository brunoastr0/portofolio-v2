<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" class="excalidraw-svg">
  <!-- svg-source:excalidraw -->
  <defs>
    <style>.hand{font-family:"Comic Sans MS","Segoe Print",sans-serif;fill:#292524}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#78716c}.actor{font-size:23px;font-weight:700;text-anchor:middle}.msg{font-size:17px;font-weight:600;text-anchor:middle}.life{stroke:#a8a29e;stroke-width:2;stroke-dasharray:9 10}.arrow{fill:none;stroke:#57534e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.return{stroke-dasharray:8 7}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#57534e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="940" fill="#fff"/>
  <text class="hand title" x="40" y="55">Ficheiros que nunca passam pela API</text>
  <text class="hand sub" x="41" y="86">A API coordena o carregamento; o armazenamento transporta os bytes.</text>
  <g stroke="#57534e" stroke-width="2.5">
    <rect x="70" y="125" width="250" height="78" rx="17" fill="#eff6ff"/><rect x="475" y="125" width="250" height="78" rx="17" fill="#f5f3ff"/><rect x="880" y="125" width="250" height="78" rx="17" fill="#f0fdf4"/>
  </g>
  <g class="hand actor"><text x="195" y="174">Aplicação cliente</text><text x="600" y="174">API</text><text x="1005" y="174">Armazenamento</text></g>
  <path class="life" d="M195 203V885"/><path class="life" d="M600 203V885"/><path class="life" d="M1005 203V885"/>
  <g class="arrow" marker-end="url(#arrow)">
    <path d="M195 278C335 274 460 282 596 278"/><path d="M600 373C602 345 596 328 600 302"/>
    <path class="return" d="M600 420C465 424 333 416 199 420"/><path d="M195 525C452 520 739 530 1001 525"/>
    <path d="M195 630C334 626 460 634 596 630"/><path d="M600 735C739 731 865 739 1001 735"/>
    <path class="return" d="M1005 820C867 824 739 816 604 820"/><path class="return" d="M600 875C462 871 333 879 199 875"/>
  </g>
  <g class="hand msg">
    <text x="397" y="260">1 · Declarar os ficheiros</text><text x="710" y="332" text-anchor="start">2 · Registar documento + ficheiros esperados</text>
    <text x="397" y="402">3 · Permissões temporárias</text><text x="600" y="506">4 · Carregar os bytes diretamente</text>
    <text x="397" y="612">5 · Informar que terminou</text><text x="802" y="717">6 · Verificar cada ficheiro declarado</text>
    <text x="802" y="802">7 · Confirmar existência</text><text x="397" y="857">8 · Pronto — ou falhas exatas</text>
  </g>
</svg>
